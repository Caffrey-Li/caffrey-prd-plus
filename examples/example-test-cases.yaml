# 示例：按 caffrey-prd-plus 的 test-cases.md，根据 examples/example-lite-filter.md 生成的可执行用例。
# 为了演示格式，假定该 PRD 已定稿为 v1.0，且「待你确认的问题」都采用了建议答案。

meta:
  prd: 咨询师列表增加“只看今天可约” PRD
  prd_version: v1.0
  generator: caffrey-prd-plus v0.4.0
  target: 微信小程序

env:                                  # 执行前由用户填写
  ENV_TYPE: 测试                      # 测试 / 预发 / 生产
  ENTRY: ""                           # 如：微信开发者工具打开项目 xxx，或真机扫码进入
  COUNSELOR_TODAY: ""                 # 今天至少有 1 个可约时段的咨询师姓名
  COUNSELOR_NOT_TODAY: ""             # 今天没有可约时段、其他日期有的咨询师姓名
  TAG_OF_TODAY: ""                    # COUNSELOR_TODAY 的一个擅长方向，如“焦虑”

data:
  - id: D1
    desc: ${COUNSELOR_TODAY} 今天至少有 1 个可约时段；${COUNSELOR_NOT_TODAY} 今天没有可约时段，明天有
    how: 在运营后台调整两位咨询师的排班【待确认】
  - id: D2
    desc: 测试环境中所有咨询师今天都没有可约时段
    how: 使用单独的测试环境，或在运营后台临时关闭今天的全部排班【待确认】

run_rules: |
  1. 先检查 env 是否已填写、data 是否已准备；缺少时停止，列出缺什么。
  2. 按 cases 的顺序执行。每条先执行 setup；setup 失败记为“阻塞”，不再执行 steps。
  3. 按“类型「文案」”中的可见文字定位元素；有 @ 时只在 @ 后的范围内找。
  4. 逐条检查 expect：全部满足记为“通过”；任何一条不满足记为“失败”，写明实际看到的内容并截图。
  5. 遇到 note 步骤时暂停请人工完成；无人处理时记为“需人工”。
  6. 不修改用例和期望结果。每条结束后执行 cleanup，再执行下一条。
  7. 全部执行完后，按“结果回填格式”输出结果表和统计。

cases:
  - id: TC-001
    feature: F-01
    title: 打开开关后只显示今天可约的咨询师
    type: 正常
    priority: P0
    prod_safe: true
    pre: [D1]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
    steps:
      - toggle: { target: 开关「只看今天可约」, value: 开 }
      - wait: 2s
    expect:
      - visible: "卡片「${COUNSELOR_TODAY}」"
      - hidden: "卡片「${COUNSELOR_NOT_TODAY}」"

  - id: TC-002
    feature: F-01
    title: 关闭开关后恢复原筛选结果
    type: 正常
    priority: P0
    prod_safe: true
    pre: [D1]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
      - toggle: { target: 开关「只看今天可约」, value: 开 }
    steps:
      - toggle: { target: 开关「只看今天可约」, value: 关 }
      - wait: 2s
    expect:
      - visible: "卡片「${COUNSELOR_TODAY}」"
      - visible: "卡片「${COUNSELOR_NOT_TODAY}」"
      - enabled: 下拉「可约日期」

  - id: TC-003
    feature: F-01
    title: 与擅长方向筛选组合时同时满足两个条件
    type: 正常
    priority: P1
    prod_safe: true
    pre: [D1]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
    steps:
      - select: { target: 下拉「擅长方向」, value: "${TAG_OF_TODAY}" }
      - toggle: { target: 开关「只看今天可约」, value: 开 }
      - wait: 2s
    expect:
      - visible: "卡片「${COUNSELOR_TODAY}」"
      - each: { target: 卡片「咨询师」, contains: "${TAG_OF_TODAY}" }

  - id: TC-004
    feature: F-01
    title: 打开开关时清空并置灰“可约日期”
    type: 边界
    priority: P1
    prod_safe: true
    pre: [D1]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
    steps:
      - select: { target: 下拉「可约日期」, value: "明天" }
      - toggle: { target: 开关「只看今天可约」, value: 开 }
    expect:
      - disabled: 下拉「可约日期」
      - text: { target: 下拉「可约日期」, value: "可约日期" }

  - id: TC-005
    feature: F-01
    title: 今天没有可约咨询师时显示空状态
    type: 边界
    priority: P1
    prod_safe: true
    pre: [D2]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
    steps:
      - toggle: { target: 开关「只看今天可约」, value: 开 }
      - wait: 2s
    expect:
      - visible: 文本「今天暂无可约的咨询师」
      - visible: 按钮「查看全部」
      - count: { target: 卡片「咨询师」, value: 0 }

  - id: TC-006
    feature: F-01
    title: 离开列表再回来，开关恢复为关闭
    type: 正常
    priority: P2
    prod_safe: true
    pre: [D1]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
      - toggle: { target: 开关「只看今天可约」, value: 开 }
    steps:
      - click: 链接「首页」@区域「底部标签栏」
      - click: 链接「咨询」@区域「底部标签栏」
    expect:
      - page: 咨询师列表
      - unchecked: 开关「只看今天可约」

  - id: TC-007
    feature: F-01
    title: 回归：开关关闭时，原有筛选和加载更多不受影响
    type: 回归
    priority: P1
    prod_safe: true
    pre: [D1]
    setup:
      - open: ${ENTRY}
      - open: 页面「咨询师列表」
    steps:
      - select: { target: 下拉「擅长方向」, value: "${TAG_OF_TODAY}" }
      - scroll: { target: 列表「咨询师」, to: 底部 }
      - wait: 2s
    expect:
      - unchecked: 开关「只看今天可约」
      - each: { target: 卡片「咨询师」, contains: "${TAG_OF_TODAY}" }
      - count: { target: 卡片「咨询师」, min: 1 }
