<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>F-01 咨询师列表 线框图</title>
  <rect x="0.5" y="0.5" width="374" height="811" fill="#FFFFFF" stroke="#999999"/>

  <!-- 导航栏 -->
  <text x="187.5" y="36" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">咨询师列表</text>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#E5E5E5"/>

  <!-- 筛选栏 -->
  <rect x="16" y="68" width="96" height="32" rx="4" fill="#FFFFFF" stroke="#999999"/>
  <text x="64" y="89" font-size="14" fill="#333333" text-anchor="middle">擅长方向 ▾</text>
  <rect x="120" y="68" width="72" height="32" rx="4" fill="#FFFFFF" stroke="#999999"/>
  <text x="156" y="89" font-size="14" fill="#333333" text-anchor="middle">价格 ▾</text>
  <rect x="200" y="68" width="96" height="32" rx="4" fill="#FFFFFF" stroke="#999999"/>
  <text x="248" y="89" font-size="14" fill="#333333" text-anchor="middle">可约日期 ▾</text>
  <circle cx="300" cy="68" r="9" fill="#000000"/>
  <text x="300" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>

  <!-- 新增：只看今天可约 -->
  <rect x="10" y="110" width="355" height="44" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="137" font-size="14" fill="#333333">只看今天可约</text>
  <rect x="120" y="122" width="40" height="20" rx="4" fill="#FFFFFF" stroke="#999999"/>
  <rect x="123" y="125" width="14" height="14" rx="2" fill="#CCCCCC"/>
  <text x="168" y="137" font-size="12" fill="#999999">默认关</text>
  <circle cx="220" cy="122" r="9" fill="#000000"/>
  <text x="220" y="126" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="355" y="137" font-size="12" fill="#000000" text-anchor="end" font-weight="bold">新增</text>
  <line x1="0" y1="166" x2="375" y2="166" stroke="#E5E5E5"/>

  <!-- 列表（不变） -->
  <rect x="16" y="180" width="343" height="96" rx="4" fill="#FFFFFF" stroke="#999999"/>
  <circle cx="50" cy="214" r="20" fill="#E5E5E5"/>
  <text x="50" y="218" font-size="12" fill="#999999" text-anchor="middle">头像</text>
  <text x="82" y="208" font-size="14" fill="#333333">{姓名} · {资质}</text>
  <text x="82" y="230" font-size="12" fill="#999999">擅长：{擅长方向}</text>
  <text x="82" y="258" font-size="14" fill="#333333">¥{价格}/次</text>
  <text x="343" y="258" font-size="12" fill="#999999" text-anchor="end">最近可约：{最近可约时间}</text>

  <rect x="16" y="288" width="343" height="96" rx="4" fill="#F5F5F5" stroke="#E5E5E5"/>
  <text x="187.5" y="340" font-size="12" fill="#999999" text-anchor="middle">咨询师卡片（同上，列表其余部分不变）</text>

  <!-- 底部标签栏（不变） -->
  <line x1="0" y1="752" x2="375" y2="752" stroke="#E5E5E5"/>
  <text x="62.5" y="786" font-size="14" fill="#999999" text-anchor="middle">首页</text>
  <text x="187.5" y="786" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">咨询</text>
  <text x="312.5" y="786" font-size="14" fill="#999999" text-anchor="middle">我的</text>
</svg>
